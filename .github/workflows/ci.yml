name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # dev merges through a merge queue; the queue waits for `ci-success` on the
  # merge_group run before it lands a group.
  merge_group:

# Three parallel jobs (fmt, clippy, test) instead of a single sequential `check`.
# Each runs on its own runner so a 4 min clippy run doesn't block a 30 s fmt
# check, and PR failures attribute to the specific gate that broke. The dev
# ruleset requires only the `ci-success` aggregator at the bottom.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - uses: zackees/setup-soldr@v0

      # Parakeet's GPU paths (the CPU fallback from #4) are only compiled with
      # these features. load-dynamic needs no ONNX Runtime at build time.
      - name: clippy (parakeet-load-dynamic,parakeet-cuda)
        run: soldr cargo clippy --all-targets --no-deps --features parakeet-load-dynamic,parakeet-cuda -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: cargo test
        run: cargo test

      - uses: zackees/setup-soldr@v0

      # Feature-gated subcommands: the default `cargo test` above does not
      # compile them, so their tests run here.
      - name: feature tests (mcp)
        run: soldr cargo test --features mcp --lib --test mcp_stdio mcp

  # Windows/macOS build gate: the library compiles on both through kernal-api
  # (audio capture, control signals, local IPC, desktop input). Required by
  # ci-success, so a change that breaks a non-Linux build cannot merge.
  kernal-api:
    name: kernal-api (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
      - name: Enable long dependency paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # OpenVINO's nested submodules exceed MAX_PATH even with a short CARGO_HOME.
        # Git for Windows supports these paths when core.longpaths is enabled.
        run: |
          git config --global core.longpaths true
          "CARGO_HOME=D:\c" >> $env:GITHUB_ENV
          # The voxtype lib's rustc command line is long on Windows (zccache
          # switches to a response file past 30K chars), and through the wrapper
          # rustc sees the --check-cfg value split on spaces ("multiple
          # input filenames ... values(cohere,"). Run this job without the
          # rustc wrapper (soldr still pins the toolchain); cargo's own
          # argfile fallback handles the long line.
          "SOLDR_RUSTC_WRAPPER=none" >> $env:GITHUB_ENV
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV
      - name: check with kernal-api audio
        run: soldr cargo check --features kernal-api --lib --keep-going
      - name: kernal-api capture tests
        run: soldr cargo test --features kernal-api --lib audio::kernal_capture
      - name: focus probe tests
        run: 'soldr cargo test --features kernal-api --lib context::'
      - name: Windows hotkey tests
        if: runner.os == 'Windows'
        run: soldr cargo test --features kernal-api --lib hotkey_windows
      - name: Windows toast tests
        if: runner.os == 'Windows'
        run: soldr cargo test --features kernal-api --lib windows_toast
      - name: Windows clipboard tests
        if: runner.os == 'Windows'
        run: soldr cargo test --features kernal-api --lib windows_clipboard
      - name: Windows login item tests
        if: runner.os == 'Windows'
        run: soldr cargo test --features kernal-api --lib windows_autostart

  # crates/voxtype-app (M6, egui): clippy, tests and a build on all three
  # OSes. The crate is a workspace member outside the root's default
  # members, so the root jobs above never build it.
  desktop-app:
    name: desktop-app (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # As in the clippy job: don't rely on the runner image's toolchain
      # shipping clippy (ubuntu-latest stopped doing so).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: zackees/setup-soldr@v0
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # GTK 3 + ayatana-appindicator for the optional Linux tray
          # (`--features linux-tray`).
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libayatana-appindicator3-dev
      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        # Same as the kernal-api job: long paths, a short CARGO_HOME, and no
        # rustc wrapper for the voxtype lib's long command line.
        run: |
          git config --global core.longpaths true
          "CARGO_HOME=D:\c" >> $env:GITHUB_ENV
          "SOLDR_RUSTC_WRAPPER=none" >> $env:GITHUB_ENV
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV
      - name: clippy
        run: soldr cargo clippy -p voxtype-app --all-targets --no-deps -- -D warnings
      - name: clippy (linux-tray)
        if: runner.os == 'Linux'
        run: soldr cargo clippy -p voxtype-app --features linux-tray --all-targets --no-deps -- -D warnings
      - name: test
        run: soldr cargo test -p voxtype-app
      - name: test (linux-tray)
        if: runner.os == 'Linux'
        run: soldr cargo test -p voxtype-app --features linux-tray
      - name: build
        run: soldr cargo build -p voxtype-app
      # `cargo run` finds the binary wherever soldr put the target dir
      # (it isn't ./target/debug on the Windows runners).
      - name: run --version
        run: soldr cargo run -p voxtype-app -- --version

  # Windows release build + per-user Inno Setup installer (M5b), uploaded as
  # an artifact on every run, after a silent install / --version /
  # uninstall round trip on the runner.
  #
  # Authenticode signing goes through Azure Artifact Signing over OIDC (no
  # client secret), as talos-hq/talos does: azure/login with the org's
  # AZURE_CLIENT_ID / AZURE_TENANT_ID, then artifact-signing-action with
  # AZURE_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE. It signs the two exes
  # before packaging and the installer after. It is attempted only on
  # pushes to dev/main: a PR or merge-queue OIDC subject has no federated
  # credential. When the secrets are missing, or the login fails because
  # the signing app registration has no federated credential for this repo
  # yet, the signing steps are skipped with a notice and the installer is
  # built unsigned. A login that works followed by a failed signature still
  # fails the job.
  windows-installer:
    name: windows-installer
    timeout-minutes: 90
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_SIGNING_PROFILE != '' }}
      TRY_SIGNING: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: zackees/setup-soldr@v0
      - name: Windows build environment
        shell: pwsh
        # As in the kernal-api and desktop-app jobs.
        run: |
          git config --global core.longpaths true
          "CARGO_HOME=D:\c" >> $env:GITHUB_ENV
          "SOLDR_RUSTC_WRAPPER=none" >> $env:GITHUB_ENV
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"
      - name: Build voxtype and voxtype-app (release)
        shell: bash
        run: |
          soldr cargo build --release --bin voxtype --features kernal-api
          soldr cargo build --release -p voxtype-app
          mkdir -p dist/bin
          # soldr may place the target dir outside ./target on Windows.
          target=$(soldr cargo metadata --format-version 1 --no-deps | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          cp "$target/release/voxtype.exe" "$target/release/voxtype-app.exe" dist/bin/
          ls -l dist/bin
          dist/bin/voxtype.exe --version
          dist/bin/voxtype-app.exe --version

      - name: Azure login (OIDC)
        id: azure-login
        if: env.TRY_SIGNING == 'true' && env.HAS_AZURE_SIGNING == 'true'
        continue-on-error: true
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Decide whether to sign
        id: signing
        shell: bash
        env:
          LOGIN: ${{ steps.azure-login.outcome }}
        run: |
          if [[ "$TRY_SIGNING" != true ]]; then
            echo "::notice title=Windows signing skipped::${GITHUB_EVENT_NAME} runs have no Azure federated credential; signing happens on pushes to dev/main. This installer is unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_AZURE_SIGNING" != true ]]; then
            echo "::notice title=Windows signing skipped::AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT or AZURE_SIGNING_PROFILE is not set. This installer is unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [[ "$LOGIN" != success ]]; then
            echo "::notice title=Windows signing skipped::Azure OIDC login failed. The signing app registration most likely has no federated credential for repo:${GITHUB_REPOSITORY} on ${GITHUB_REF} yet (an owner adds it in Entra ID). This installer is unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign voxtype.exe and voxtype-app.exe
        if: steps.signing.outputs.sign == 'true'
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Preinstalled on some runner images (Inno Setup 6); otherwise
          # Chocolatey's current release (6 or 7).
          function Find-Iscc {
            foreach ($root in ${env:ProgramFiles(x86)}, $env:ProgramFiles) {
              foreach ($v in '7', '6') {
                $p = Join-Path $root "Inno Setup $v\ISCC.exe"
                if (Test-Path $p) { return $p }
              }
            }
          }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Find-Iscc }
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          Write-Host "Using $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build the installer
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=${{ steps.version.outputs.version }}" "/DBinDir=$pwd\dist\bin" "/DOutputDir=$pwd\dist" packaging\windows\voxtype.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem dist\*.exe
      - name: Sign the installer
        if: steps.signing.outputs.sign == 'true'
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\voxtype-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Check signatures
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.sign }}
        run: |
          $files = @("dist\bin\voxtype.exe", "dist\bin\voxtype-app.exe", "dist\voxtype-${{ steps.version.outputs.version }}-windows-x64-setup.exe")
          $sigs = $files | ForEach-Object { Get-AuthenticodeSignature $_ }
          $sigs | ForEach-Object { Write-Host "$($_.Status)  $($_.Path)  $($_.SignerCertificate.Subject)" }
          $bad = $sigs | Where-Object Status -ne 'Valid'
          if ($env:SIGNED -eq 'true' -and $bad) { throw "$(@($bad).Count) file(s) not validly signed" }

      - name: Install, run and uninstall silently
        shell: pwsh
        run: |
          $setup = "dist\voxtype-${{ steps.version.outputs.version }}-windows-x64-setup.exe"
          $dir = "$env:LOCALAPPDATA\Programs\Voxtype"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=autostart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          foreach ($f in 'voxtype.exe','voxtype-app.exe','LICENSE.txt','unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "$f was not installed" }
          }
          & "$dir\voxtype.exe" --version
          & "$dir\voxtype-app.exe" --version
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (-not ($path -split ';' -contains $dir)) { throw "install dir not on the user PATH: $path" }
          $run = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).Voxtype
          if ($run -notlike "*voxtype-app.exe*") { throw "login item missing: $run" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited $($p.ExitCode)" }
          # unins000.exe hands off to a temp copy and returns early; give
          # that copy up to 60 s to finish.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$dir\voxtype.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$dir\voxtype.exe") { throw "voxtype.exe left behind" }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if ($path -split ';' -contains $dir) { throw "install dir still on the user PATH" }
          $run = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -ErrorAction SilentlyContinue).Voxtype
          if ($run) { throw "login item left behind" }
          Write-Host "install / run / uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: voxtype-${{ steps.version.outputs.version }}-windows-x64-setup
          path: dist/voxtype-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  # Aggregator job: the dev ruleset requires only `ci-success` (through the
  # merge queue). Adding/removing parallel checks above just updates the
  # `needs:` list; the ruleset never needs to be touched.
  #
  # Every job must succeed, with one exception: GitHub's hosted macOS runners
  # sometimes run out of capacity and cancel a job that never got a runner
  # ("The job was not acquired by Runner of type hosted even after multiple
  # attempts"). A kernal-api or desktop-app (macos-latest) job that ended
  # `cancelled` with no runner assigned is reported as a warning instead of
  # failing the gate.
  # Windows stays strictly required, and a macOS job that did get a runner and
  # then failed, timed out or was cancelled still fails the gate.
  ci-success:
    name: ci-success
    needs: [fmt, clippy, test, kernal-api, desktop-app, windows-installer]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Verify all required jobs succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
          KERNAL: ${{ needs.kernal-api.result }}
          DESKTOP_APP: ${{ needs.desktop-app.result }}
          WINDOWS_INSTALLER: ${{ needs.windows-installer.result }}
        run: |
          set -euo pipefail
          echo "fmt:        $FMT"
          echo "clippy:     $CLIPPY"
          echo "test:       $TEST"
          echo "kernal-api: $KERNAL"
          echo "desktop-app: $DESKTOP_APP"
          echo "windows-installer: $WINDOWS_INSTALLER"
          fail=0
          for r in "$FMT" "$CLIPPY" "$TEST" "$WINDOWS_INSTALLER"; do
            [[ "$r" == success ]] || fail=1
          done
          jobs=""
          # A matrix job's result aggregates its legs; inspect each leg of
          # this run attempt through the API. Usage: check_legs NAME OS...
          check_legs() {
            local name=$1 os line conclusion runner
            shift
            if [[ -z "$jobs" ]]; then
              jobs=$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
                --jq '.jobs[] | [.name, (.conclusion // "none"), (.runner_name // "")] | @tsv')
            fi
            for os in "$@"; do
              line=$(printf '%s\n' "$jobs" | awk -F'\t' -v n="$name ($os)" '$1 == n' | tail -n 1)
              conclusion=$(printf '%s' "$line" | cut -f2)
              runner=$(printf '%s' "$line" | cut -f3)
              echo "$name ($os): conclusion=${conclusion:-missing} runner=${runner:-<none>}"
              [[ "$conclusion" == success ]] && continue
              if [[ "$os" == macos-latest && "$conclusion" == cancelled && -z "$runner" ]]; then
                echo "::warning::$name (macos-latest) was cancelled before any hosted runner picked it up (runner capacity); not blocking."
                continue
              fi
              fail=1
            done
          }
          if [[ "$KERNAL" != success ]]; then
            check_legs kernal-api windows-latest macos-latest
          fi
          if [[ "$DESKTOP_APP" != success ]]; then
            check_legs desktop-app ubuntu-latest windows-latest macos-latest
          fi
          if [[ "$fail" != 0 ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs succeeded."
