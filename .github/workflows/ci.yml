name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # dev merges through a merge queue; the queue waits for `ci-success` on the
  # merge_group run before it lands a group.
  merge_group:

# Three parallel jobs (fmt, clippy, test) instead of a single sequential `check`.
# Each runs on its own runner so a 4 min clippy run doesn't block a 30 s fmt
# check, and PR failures attribute to the specific gate that broke. The dev
# ruleset requires only the `ci-success` aggregator at the bottom.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - uses: zackees/setup-soldr@v0

      # Parakeet's GPU paths (the CPU fallback from #4) are only compiled with
      # these features. load-dynamic needs no ONNX Runtime at build time.
      - name: clippy (parakeet-load-dynamic,parakeet-cuda)
        run: soldr cargo clippy --all-targets --no-deps --features parakeet-load-dynamic,parakeet-cuda -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: cargo test
        run: cargo test

      - uses: zackees/setup-soldr@v0

      # Feature-gated subcommands: the default `cargo test` above does not
      # compile them, so their tests run here.
      - name: feature tests (mcp)
        run: soldr cargo test --features mcp --lib --test mcp_stdio mcp

  # Windows/macOS build gate: the library compiles on both through kernal-api
  # (audio capture, control signals, local IPC, desktop input). Required by
  # ci-success, so a change that breaks a non-Linux build cannot merge.
  kernal-api:
    name: kernal-api (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
      - name: Enable long dependency paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # OpenVINO's nested submodules exceed MAX_PATH even with a short CARGO_HOME.
        # Git for Windows supports these paths when core.longpaths is enabled.
        run: |
          git config --global core.longpaths true
          "CARGO_HOME=D:\c" >> $env:GITHUB_ENV
          # The voxtype lib's rustc command line is long on Windows (zccache
          # switches to a response file past 30K chars), and through the wrapper
          # rustc sees the --check-cfg value split on spaces ("multiple
          # input filenames ... values(cohere,"). Run this job without the
          # rustc wrapper (soldr still pins the toolchain); cargo's own
          # argfile fallback handles the long line.
          "SOLDR_RUSTC_WRAPPER=none" >> $env:GITHUB_ENV
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV
      - name: check with kernal-api audio
        run: soldr cargo check --features kernal-api --lib --keep-going
      - name: kernal-api capture tests
        run: soldr cargo test --features kernal-api --lib audio::kernal_capture
      - name: focus probe tests
        run: 'soldr cargo test --features kernal-api --lib context::'
      - name: Windows hotkey tests
        if: runner.os == 'Windows'
        run: soldr cargo test --features kernal-api --lib hotkey_windows
      - name: Windows toast tests
        if: runner.os == 'Windows'
        run: soldr cargo test --features kernal-api --lib windows_toast
      - name: Windows clipboard tests
        if: runner.os == 'Windows'
        run: soldr cargo test --features kernal-api --lib windows_clipboard
      - name: Windows login item tests
        if: runner.os == 'Windows'
        run: soldr cargo test --features kernal-api --lib windows_autostart

  # Aggregator job: the dev ruleset requires only `ci-success` (through the
  # merge queue). Adding/removing parallel checks above just updates the
  # `needs:` list; the ruleset never needs to be touched.
  #
  # Every job must succeed, with one exception: GitHub's hosted macOS runners
  # sometimes run out of capacity and cancel a job that never got a runner
  # ("The job was not acquired by Runner of type hosted even after multiple
  # attempts"). A kernal-api (macos-latest) job that ended `cancelled` with no
  # runner assigned is reported as a warning instead of failing the gate.
  # Windows stays strictly required, and a macOS job that did get a runner and
  # then failed, timed out or was cancelled still fails the gate.
  ci-success:
    name: ci-success
    needs: [fmt, clippy, test, kernal-api]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Verify all required jobs succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
          KERNAL: ${{ needs.kernal-api.result }}
        run: |
          set -euo pipefail
          echo "fmt:        $FMT"
          echo "clippy:     $CLIPPY"
          echo "test:       $TEST"
          echo "kernal-api: $KERNAL"
          fail=0
          for r in "$FMT" "$CLIPPY" "$TEST"; do
            [[ "$r" == success ]] || fail=1
          done
          if [[ "$KERNAL" != success ]]; then
            # needs.kernal-api.result aggregates the matrix; inspect each leg
            # of this run attempt through the API.
            jobs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("kernal-api (")) | [.name, (.conclusion // "none"), (.runner_name // "")] | @tsv')
            for os in windows-latest macos-latest; do
              line=$(printf '%s\n' "$jobs" | awk -F'\t' -v n="kernal-api ($os)" '$1 == n' | tail -n 1)
              conclusion=$(printf '%s' "$line" | cut -f2)
              runner=$(printf '%s' "$line" | cut -f3)
              echo "kernal-api ($os): conclusion=${conclusion:-missing} runner=${runner:-<none>}"
              [[ "$conclusion" == success ]] && continue
              if [[ "$os" == macos-latest && "$conclusion" == cancelled && -z "$runner" ]]; then
                echo "::warning::kernal-api (macos-latest) was cancelled before any hosted runner picked it up (runner capacity); not blocking."
                continue
              fi
              fail=1
            done
          fi
          if [[ "$fail" != 0 ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs succeeded."
