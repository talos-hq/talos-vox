name: Build macOS

# `contents: write` is required by softprops/action-gh-release@v1 to create
# the GH release and upload assets on tag push. Without it the upload step
# fails with HTTP 403 even though the cargo build succeeds.
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc*'
    branches:
      - 'rc/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave blank to read from Cargo.toml)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-14  # Apple Silicon runner for ARM64 build
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Hoisted to job scope on purpose. A step's `if:` cannot read that same
    # step's own `env:` block, so gating on secrets has to happen against a
    # job-level env var or the step silently never runs.
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT != '' }}
      # Notary credentials: the talos-hq naming (APPLE_NOTARY_USER/PASSWORD,
      # an app-specific password) or upstream's APPLE_ID/APPLE_ID_PASSWORD.
      HAS_NOTARY_CREDS: ${{ (secrets.APPLE_NOTARY_USER || secrets.APPLE_ID) != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ github.event.inputs.version }}" ]]; then
              VERSION="${{ github.event.inputs.version }}"
            else
              VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Branch push (e.g. rc/*) — read from Cargo.toml
            VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION}"

      - name: Build for x86_64
        run: |
          cargo build --release --target x86_64-apple-darwin --features gpu-metal

      - name: Build for aarch64
        run: |
          cargo build --release --target aarch64-apple-darwin --features gpu-metal

      - name: Create universal binary
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p releases/${VERSION}
          lipo -create \
            target/x86_64-apple-darwin/release/voxtype \
            target/aarch64-apple-darwin/release/voxtype \
            -output releases/${VERSION}/voxtype-${VERSION}-macos-universal
          chmod +x releases/${VERSION}/voxtype-${VERSION}-macos-universal

      - name: Verify universal binary
        run: |
          VERSION=${{ steps.version.outputs.version }}
          lipo -info releases/${VERSION}/voxtype-${VERSION}-macos-universal
          releases/${VERSION}/voxtype-${VERSION}-macos-universal --version

      - name: Import certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          rm certificate.p12

          # Add keychain to search list
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Allow codesign to access key
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Sign binary
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BINARY=releases/${VERSION}/voxtype-${VERSION}-macos-universal

          # Find the signing identity
          IDENTITY=$(security find-identity -v -p codesigning | \
            grep "Developer ID Application" | head -1 | \
            sed 's/.*"\(.*\)".*/\1/')

          # Hardened runtime blocks the microphone unless the binary carries
          # com.apple.security.device.audio-input (macos/voxtype.entitlements).
          codesign --force --verbose \
            --sign "$IDENTITY" \
            --timestamp \
            --options runtime \
            --entitlements macos/voxtype.entitlements \
            "$BINARY"

          codesign --verify --strict --verbose=2 "$BINARY"
          codesign -d --entitlements - --xml "$BINARY" | grep -q device.audio-input

      - name: Notarize binary
        if: env.HAS_NOTARY_CREDS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_USER || secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD || secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BINARY=releases/${VERSION}/voxtype-${VERSION}-macos-universal

          # A standalone Mach-O can be notarized but has nowhere to hold the
          # ticket, so there is no stapling here. Gatekeeper checks this one
          # online. The DMG below is what gets stapled.
          ditto -c -k "$BINARY" "${BINARY}.zip"
          xcrun notarytool submit "${BINARY}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm "${BINARY}.zip"

      - name: Build app bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VOXTYPE_SKIP_DMG=1 ./scripts/build-macos-dmg.sh "$VERSION"

      - name: Sign app bundle
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APP=releases/${VERSION}/Voxtype.app

          IDENTITY=$(security find-identity -v -p codesigning | \
            grep "Developer ID Application" | head -1 | \
            sed 's/.*"\(.*\)".*/\1/')

          # Inner code first, then the wrapper, each with its own entitlements.
          # No --deep on the outer sign: it would re-sign every nested binary
          # with the outer entitlements (or none), and the hardened runtime
          # would then deny the microphone/Apple Events to whichever lost them.
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" \
            "$APP/Contents/MacOS/VoxtypeMenubar.app"
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" \
            --entitlements macos/VoxtypeSetup/VoxtypeSetup.entitlements \
            "$APP/Contents/MacOS/VoxtypeSetup.app"

          # Signing the bundle signs its main executable (voxtype-bin, the
          # daemon) with the same identity, so TCC sees one responsible app.
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" \
            --entitlements macos/voxtype.entitlements \
            "$APP"

          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign -d --entitlements - --xml "$APP/Contents/MacOS/voxtype-bin" \
            | grep -q device.audio-input
          codesign -d --entitlements - --xml "$APP/Contents/MacOS/VoxtypeSetup.app" \
            | grep -q device.audio-input

      - name: Package DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VOXTYPE_SKIP_APP=1 ./scripts/build-macos-dmg.sh "$VERSION"

      - name: Sign DMG
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG=releases/${VERSION}/voxtype-${VERSION}-macos-universal.dmg

          IDENTITY=$(security find-identity -v -p codesigning | \
            grep "Developer ID Application" | head -1 | \
            sed 's/.*"\(.*\)".*/\1/')

          codesign --force --timestamp --sign "$IDENTITY" "$DMG"

      - name: Notarize and staple DMG
        if: env.HAS_NOTARY_CREDS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_USER || secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD || secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG=releases/${VERSION}/voxtype-${VERSION}-macos-universal.dmg

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # A DMG can hold the ticket, so staple it. This is what makes the
          # download work on a machine with no network path to Apple.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Gatekeeper assessment
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APP=releases/${VERSION}/Voxtype.app
          DMG=releases/${VERSION}/voxtype-${VERSION}-macos-universal.dmg
          # Without notary credentials this reports "Unnotarized Developer ID"
          # and is informational. With them, the stapled DMG must assess as
          # "Notarized Developer ID" (#3 M5 acceptance).
          spctl -a -vv "$APP" 2>&1 || true
          if [[ "$HAS_NOTARY_CREDS" == "true" ]]; then
            spctl -a -vv -t open --context context:primary-signature "$DMG" 2>&1 | tee spctl.txt
            grep -q "Notarized Developer ID" spctl.txt
          else
            spctl -a -vv -t open --context context:primary-signature "$DMG" 2>&1 || true
          fi

      - name: Generate checksums
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd releases/${VERSION}
          # Namespaced per platform. Both this job and build-linux.yml upload
          # to the same release, and a bare SHA256SUMS.txt from each meant one
          # silently clobbered the other.
          shasum -a 256 voxtype-* > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxtype-${{ steps.version.outputs.version }}-macos
          path: |
            releases/${{ steps.version.outputs.version }}/voxtype-*
            releases/${{ steps.version.outputs.version }}/SHA256SUMS-macos.txt

      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          # Whichever workflow finishes first CREATES the release, and a
          # created release defaults to prerelease=false, which GitHub then
          # marks "latest". This step racing ahead of Build Linux on the
          # v1.1.0-rc2 tag published an RC as the latest release. Every
          # workflow that can create the release must set this.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            releases/${{ steps.version.outputs.version }}/voxtype-*
            releases/${{ steps.version.outputs.version }}/SHA256SUMS-macos.txt

  # Homebrew cask + WinGet manifest (M5c). Fills the templates in
  # packaging/homebrew-tap/ and packaging/winget/ from this run's DMG and,
  # on a tag whose release has one, the Windows installer. Then validates
  # them: `brew style` + `brew audit --cask --strict` (Homebrew is on the
  # Ubuntu runner) and Microsoft's JSON schema for each WinGet file.
  #
  # Nothing is published. The rendered files are a workflow artifact for the
  # owner to copy into talos-hq/homebrew-tap and a microsoft/winget-pkgs PR
  # once the artifacts are signed and notarized. See
  # packaging/homebrew-tap/README.md.
  package-manifests:
    name: package-manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: voxtype-${{ needs.build.outputs.version }}-macos
          path: artifacts

      - name: Find the Windows installer on the release
        id: windows
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Uploaded by the Windows signing job (M5b) once that exists. Until
          # then the release has no installer and only the cask is rendered.
          if gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --pattern "voxtype-${VERSION}-windows-x64-setup.exe" --dir artifacts; then
            echo "installer=artifacts/voxtype-${VERSION}-windows-x64-setup.exe" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Windows installer on v${VERSION}: WinGet manifest not rendered"
          fi

      - name: Set up validators
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml jsonschema
          # Homebrew is preinstalled on the Ubuntu runner but not on PATH.
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Validate the templates (dry run)
        run: |
          set -euo pipefail
          .venv/bin/python scripts/package-manifests.py render --dry-run \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --out dry-run
          .venv/bin/python scripts/package-manifests.py validate dry-run --schema-cache .schemas

      - name: Render from the release artifacts
        env:
          INSTALLER: ${{ steps.windows.outputs.installer }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --repo "$GITHUB_REPOSITORY" --out package-manifests)
          args+=(--dmg "artifacts/voxtype-${VERSION}-macos-universal.dmg")
          if [[ -n "${INSTALLER:-}" ]]; then
            args+=(--windows-installer "$INSTALLER")
          fi
          .venv/bin/python scripts/package-manifests.py render "${args[@]}"
          .venv/bin/python scripts/package-manifests.py validate package-manifests --schema-cache .schemas
          find package-manifests -type f | sort

      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: voxtype-${{ needs.build.outputs.version }}-package-manifests
          path: package-manifests
          if-no-files-found: error

  # Aggregator job — branch protection only needs to require `macos-ci-success`.
  # If we add more macOS jobs (arm64 smoke test, notarization gate, etc.) they
  # join the `needs:` list and the protection rule keeps working unchanged.
  macos-ci-success:
    name: macos-ci-success
    needs: [build, package-manifests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          set -e
          build='${{ needs.build.result }}'
          manifests='${{ needs.package-manifests.result }}'
          echo "build: $build"
          echo "package-manifests: $manifests"
          if [[ "$build" != success ]]; then
            echo "::error::macOS build did not succeed"
            exit 1
          fi
          if [[ "$manifests" != success ]]; then
            echo "::error::Homebrew cask / WinGet manifest generation did not succeed"
            exit 1
          fi
          echo "macOS build succeeded."
