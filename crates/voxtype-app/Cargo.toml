[package]
name = "voxtype-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop app for the voxtype daemon (egui): tray, daemon supervisor, status, history, settings and modes"
publish = false

# Not in the root's default-members: `cargo build` / `cargo test` at the repo
# root build the daemon exactly as before. Build this with
# `soldr cargo build -p voxtype-app`.

[dependencies]
voxtype = { path = "../.." }
# egui on wgpu, the stack picked in docs/GUI-STACK-ADR.md. Default features:
# wgpu backend, Wayland + X11, AccessKit, default fonts.
eframe = "0.34"
serde_json = "1"
chrono = "0.4"
# [[modes]] is an array of tables the scalar config schema does not cover.
toml_edit = "0.22"
# The HUD reads the level socket with voxtype::osd::ipc (async).
tokio = { version = "1", features = ["rt", "time"] }

[features]
default = []
# The tray icon on Linux: needs GTK 3 and libayatana-appindicator3 at build
# and run time, and a StatusNotifier host to show it. macOS and Windows
# always get the tray.
linux-tray = ["dep:tray-icon", "dep:gtk"]

[target.'cfg(unix)'.dependencies]
# SIGTERM to the supervised daemon, PR_SET_PDEATHSIG on Linux.
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Same crate and version as `voxtype menubar` (src/menubar.rs). No libxdo:
# the menu has no accelerators.
tray-icon = { version = "0.21.3", default-features = false }
# The HUD's native window, for flags eframe doesn't expose.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# eframe's winit, for the HUD's Accessory activation policy.
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.21.3", default-features = false, optional = true }
gtk = { version = "0.18", optional = true }

# The control channel on non-Unix hosts is a kernal-api named pipe.
[target.'cfg(windows)'.dependencies]
voxtype = { path = "../..", features = ["kernal-api"] }
# HUD window styles and region.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
# The Terminate control signal for a graceful daemon stop. Same pin as the
# root crate.
kernal-api = { git = "https://github.com/forge-ci/kernal-api", rev = "56544cee564b3c063a8e71a6b3b76d2d1bcb669b", features = ["control-signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
